name: BorderBeamShowcase
options:
  bundleIdPrefix: com.jakubantalik
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  BorderBeamKit:
    path: ../BorderBeamKit

targets:
  BorderBeamShowcase:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: BorderBeamKit
        product: BorderBeamKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Beam Showcase
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        PRODUCT_BUNDLE_IDENTIFIER: com.jakubantalik.BorderBeamShowcase
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
