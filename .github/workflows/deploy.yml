name: Deploy beam site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # One lockfile at the workspace root now covers the library and
          # both sites; demo/package-lock.json no longer exists.
          cache-dependency-path: package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # A single root install links the workspaces, so the site resolves the
      # library without a second `npm ci`.
      - name: Install workspace dependencies
        run: npm ci

      - name: Build beam site
        run: npm run build:site-beam

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sites/beam/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
